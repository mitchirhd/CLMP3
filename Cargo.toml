[package]
name = "clmp3"
version = "0.2.0"
edition = "2024"
description = "Audioplayer that runs in a terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mitchirhd/CLMP3"
readme = "README.md"
keywords = ["music", "player", "tui"]
categories = ["command-line-utilities", "multimedia::audio"]

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
opt-level = 3

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
image = "0.25.10"
lofty = "0.25.4"
rand = "0.10.3"
ratatui = "0.30.2"
ratatui-explorer = "0.3.0"
ratatui-image = { version = "11.1.0", default-features = false, features = ["image-defaults", "crossterm"] }
ratatui-textarea = "0.9.3"
reqwest = {version = "0.13.5", features = ["blocking"] }
rodio = "0.22.2"
tui-slider = "0.3.4"
