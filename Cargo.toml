[package]
name = "clmp3"
version = "0.2.1"
edition = "2024"
description = "Audioplayer that runs in a terminal"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mitchirhd/CLMP3"
readme = "README.md"
keywords = ["music", "player", "tui"]
categories = ["command-line-utilities", "multimedia::audio"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
image = "0.25.10"
lofty = "0.25.4"
rand = "0.10.3"
ratatui = "0.30.2"
ratatui-explorer = "0.3.0"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
ratatui-textarea = "0.9.3"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "flac"] }
tui-slider = "0.3.4"
ureq = "3.4.2"
